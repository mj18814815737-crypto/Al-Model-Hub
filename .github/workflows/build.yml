name: Build Windows Executable
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'main.js'
      - 'preload.js'
      - 'index.html'
      - 'renderer.js'
      - 'data/**'
      - 'app-icon.ico'
      - '启动AI模型库.bat'
      - '.github/workflows/build.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Executable
          path: dist/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: v1.0.0-build-${{ github.sha }}
          name: AI Model Hub v1.0.0
          body: "Automated Windows client build"
          draft: false
          prerelease: false